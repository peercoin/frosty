name: Test and Analyze

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frosty/rust -> target

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Dart package dependencies
        working-directory: frosty
        run: dart pub get

      - name: Resolve Flutter example dependencies
        working-directory: frosty/example
        run: flutter pub get

      - name: Verify Dart formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze Dart package
        working-directory: frosty
        run: dart analyze --fatal-infos

      - name: Analyze Flutter example
        working-directory: frosty/example
        run: flutter analyze --fatal-infos

      - name: Verify Rust formatting
        run: cargo fmt --check --manifest-path frosty/rust/Cargo.toml

      - name: Check Rust library
        run: cargo check --locked --manifest-path frosty/rust/Cargo.toml

      - name: Run Dart tests
        working-directory: frosty
        run: dart test
