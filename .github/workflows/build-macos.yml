name: Build macOS

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: rust -> target

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve frosty dependencies
        run: dart pub get

      - name: Build Dart CLI release bundle
        run: dart build cli --target example/tweak_example.dart

      - name: Resolve Flutter example dependencies
        working-directory: example
        run: flutter pub get

      - name: Build Flutter macOS release
        working-directory: example
        run: flutter build macos --release --no-pub
