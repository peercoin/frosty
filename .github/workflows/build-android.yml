name: Build Android

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Java 21
        uses: actions/setup-java@v6.0.1
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.98.0

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frosty/rust -> target

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter example dependencies
        working-directory: frosty/example
        run: flutter pub get

      - name: Build Flutter Android release APK
        working-directory: frosty/example
        run: flutter build apk --release --no-pub
