name: Build iOS

on:
  push:
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v7.0.1

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: frosty_flutter/rust -> target

      - name: Set up Flutter
        uses: subosito/flutter-action@v2.23.0
        with:
          channel: stable
          cache: true

      - name: Resolve Flutter example dependencies
        working-directory: frosty_flutter/example
        run: flutter pub get

      - name: Build unsigned Flutter iOS release
        working-directory: frosty_flutter/example
        run: flutter build ios --release --no-codesign --no-pub
