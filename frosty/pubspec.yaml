name: frosty
description: FROST threshold Schnorr signatures using an underlying Rust library
version: 4.0.0
repository: https://github.com/peercoin/frosty

environment:
  sdk: ^3.10.0

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.1.0
  flutter_rust_bridge: 2.12.0
  hooks: ^2.2.0
  native_toolchain_rust: ^1.0.7
  path: ^1.8.3
  coinlib: ^4.0.0
  freezed_annotation: ^2.4.1

dev_dependencies:
  build_runner: ^2.4.8
  ffigen: ^20.1.1
  freezed: ^2.4.7
  lints: ^5.1.1
  test: ^1.24.0

flutter:
  assets:
    - web/pkg/frosty_rust.js
    - web/pkg/frosty_rust_bg.wasm
