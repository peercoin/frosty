name: frosty
description: FROST threshold Schnorr signatures using an underlying Rust library
version: 4.0.0
repository: https://github.com/peercoin/frosty

environment:
  sdk: ^3.13.0

resolution: workspace

dependencies:
  code_assets: ^2.1.0
  ffi: ^2.2.0
  flutter_rust_bridge: 2.12.0
  hooks: ^2.2.0
  native_toolchain_rust: ^1.0.7
  path: ^1.9.1
  coinlib: '>=6.0.0 <7.0.0'
  freezed_annotation: ^3.1.0

dev_dependencies:
  build_runner: ^2.16.1
  ffigen: ^22.0.0
  freezed: ^4.0.1
  lints: ^6.1.0
  test: ^1.32.0

flutter:
  assets:
    - web/pkg/frosty_rust.js
    - web/pkg/frosty_rust_bg.wasm
